<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>対戦記録</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --text:#1f2430;
    --sub:#6b7280;
    --border:#e2e4e9;
    --primary:#3d6bff;
    --primary-dark:#2a4fd6;
    --win:#1f9d55;
    --lose:#e2402b;
    --draw:#9b7a1e;
    --danger:#e2402b;
    --tag-bg:#eef1ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;}
  body{padding-bottom:72px;}
  h1,h2,h3{margin:0 0 8px;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  header.top{
    position:sticky;top:0;z-index:10;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:10px 12px;
  }
  header.top h1{font-size:16px;color:var(--sub);font-weight:600;}
  .game-select-row{display:flex;gap:8px;align-items:center;margin-top:4px;}
  select, input[type=text], input[type=date], textarea{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
    background:#fff;
    color:var(--text);
  }
  textarea{resize:vertical;min-height:70px;}
  .game-select-row select{flex:1;}

  main{padding:12px;max-width:720px;margin:0 auto;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px;font-weight:600;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:12px 16px;
    border-radius:10px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    background:#eceef2;
    color:var(--text);
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-danger{background:#fdeceb;color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 10px;font-size:13px;border-radius:8px;}
  .btn-group{display:flex;gap:8px;flex-wrap:wrap;}

  .choice-group{display:flex;gap:8px;flex-wrap:wrap;}
  .choice-btn{
    flex:1;
    min-width:90px;
    padding:12px 8px;
    text-align:center;
    border-radius:10px;
    border:2px solid var(--border);
    background:#fff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    color:var(--sub);
  }
  .choice-btn.active{border-color:var(--primary);color:var(--primary);background:#eef1ff;}
  .choice-btn.active.win{border-color:var(--win);color:var(--win);background:#e9f8ef;}
  .choice-btn.active.lose{border-color:var(--lose);color:var(--lose);background:#fdeceb;}
  .choice-btn.active.draw{border-color:var(--draw);color:var(--draw);background:#fbf3e0;}

  .tag-chip{
    display:inline-flex;align-items:center;
    min-height:44px;
    padding:7px 12px;
    border-radius:999px;
    border:1.5px solid var(--border);
    background:#fff;
    font-size:13px;
    margin:3px;
    cursor:pointer;
    color:var(--sub);
    font-weight:600;
  }
  .tag-chip.active{background:var(--tag-bg);border-color:var(--primary);color:var(--primary-dark);}
  .tag-wrap{display:flex;flex-wrap:wrap;margin:-3px;}
  .tag-add-chip{border-style:dashed;color:var(--primary);}
  .tag-add-inline{display:flex;gap:6px;margin-top:8px;}
  .tag-add-inline input{flex:1;}

  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--border);
    z-index:20;
  }
  nav.tabs button{
    flex:1;
    padding:12px 4px 10px;
    background:none;border:none;
    font-size:12px;
    color:var(--sub);
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:var(--primary);font-weight:700;}

  .match-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    background:#fff;
  }
  .match-item .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .result-badge{
    font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;color:#fff;flex-shrink:0;
  }
  .result-badge.win{background:var(--win);}
  .result-badge.lose{background:var(--lose);}
  .result-badge.draw{background:var(--draw);}
  .match-item .meta{font-size:12px;color:var(--sub);margin-top:4px;}
  .match-item .memo{font-size:13px;margin-top:6px;color:var(--text);white-space:pre-wrap;}
  .match-item .tags{margin-top:6px;}
  .match-item .tags span{
    display:inline-block;font-size:11px;background:var(--tag-bg);color:var(--primary-dark);
    padding:2px 8px;border-radius:999px;margin:2px 3px 0 0;
  }
  .match-item .actions{display:flex;gap:6px;margin-top:8px;}

  .empty-note{color:var(--sub);font-size:13px;text-align:center;padding:20px 8px;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .stat-box .num{font-size:22px;font-weight:700;}
  .stat-box .label{font-size:12px;color:var(--sub);margin-top:2px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.data-table th,table.data-table td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left;}
  table.data-table th{color:var(--sub);font-weight:600;}

  .period-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .period-nav .label{font-weight:700;font-size:14px;flex:1;text-align:center;}
  .period-type-row{display:flex;gap:6px;margin-bottom:10px;}
  .period-type-row button{flex:1;}

  .list-item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);}
  .list-item-row:last-child{border-bottom:none;}
  .list-item-row .name{font-weight:600;}
  .list-item-row .sub{font-size:12px;color:var(--sub);}
  .inline-actions{display:flex;gap:6px;}

  .section-title{font-size:14px;font-weight:700;margin:14px 0 8px;color:var(--sub);}
  .close-x{background:none;border:none;font-size:20px;color:var(--sub);cursor:pointer;padding:4px 8px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.4);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-sheet{
    background:#fff;width:100%;max-width:720px;border-radius:16px 16px 0 0;
    padding:16px;max-height:90vh;overflow-y:auto;
  }
  .modal-sheet .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

  @media (min-width:600px){
    .modal-overlay{align-items:center;}
    .modal-sheet{border-radius:16px;}
  }
</style>
</head>
<body>

<header class="top">
  <h1>カードゲーム対戦記録</h1>
  <div class="game-select-row">
    <select id="gameSelect"></select>
    <button class="btn btn-sm" id="manageGamesBtn">ゲーム管理</button>
  </div>
</header>

<main id="mainArea"></main>

<nav class="tabs">
  <button data-tab="record" class="active"><span class="ic">📝</span>記録</button>
  <button data-tab="list"><span class="ic">📋</span>一覧</button>
  <button data-tab="stats"><span class="ic">📊</span>集計</button>
  <button data-tab="manage"><span class="ic">⚙️</span>管理</button>
</nav>

<div id="modalRoot"></div>

<script>
(function(){
"use strict";

/* ---------------- Data layer ---------------- */
const STORAGE_KEY = "cardRecordApp_v1";
const DEFAULT_TAGS = ["事故","引き負け","プレミ","メタ読み成功","展開勝ち"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function loadData(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ raw = null; }
  if(!raw || typeof raw !== "object"){
    raw = { games: [], tags: DEFAULT_TAGS.map(n=>({id:uid(), name:n})), matches: [] };
  }
  if(!Array.isArray(raw.games)) raw.games = [];
  if(!Array.isArray(raw.tags)) raw.tags = DEFAULT_TAGS.map(n=>({id:uid(), name:n}));
  if(!Array.isArray(raw.matches)) raw.matches = [];
  raw.games.forEach(g=>{ if(!Array.isArray(g.decks)) g.decks = []; });
  return raw;
}

let data = loadData();
let selectedGameId = localStorage.getItem(STORAGE_KEY+"_selectedGame") || (data.games[0] && data.games[0].id) || null;

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function setSelectedGame(id){
  selectedGameId = id;
  localStorage.setItem(STORAGE_KEY+"_selectedGame", id || "");
}

function getGame(id){ return data.games.find(g=>g.id===id) || null; }
function getDeck(gameId, deckId){ const g=getGame(gameId); return g ? g.decks.find(d=>d.id===deckId) : null; }

/* ---------------- Date helpers ---------------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parseDate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function fmtDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// Monday-start week range containing date d
function weekRange(d){
  const day = d.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (day===0) ? -6 : 1-day;
  const start = new Date(d); start.setDate(d.getDate()+diffToMonday);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return [start,end];
}
function monthRange(d){
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return [start,end];
}
function dayRange(d){
  return [new Date(d), new Date(d)];
}

/* ---------------- Modal helper ---------------- */
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
function openModal(innerHtml, onMount){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">${innerHtml}</div></div>`;
  root.querySelector("#modalOverlay").addEventListener("click", (e)=>{
    if(e.target.id === "modalOverlay") closeModal();
  });
  if(onMount) onMount(root);
}

/* ---------------- Tabs ---------------- */
let currentTab = "record";
const tabButtons = document.querySelectorAll("nav.tabs button");
tabButtons.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentTab = btn.dataset.tab;
    tabButtons.forEach(b=>b.classList.toggle("active", b===btn));
    render();
  });
});

/* ---------------- Game select header ---------------- */
function renderGameSelect(){
  const sel = document.getElementById("gameSelect");
  if(data.games.length===0){
    sel.innerHTML = `<option value="">(ゲーム未登録)</option>`;
    sel.disabled = true;
    selectedGameId = null;
    return;
  }
  sel.disabled = false;
  if(!getGame(selectedGameId)) setSelectedGame(data.games[0].id);
  sel.innerHTML = data.games.map(g=>`<option value="${g.id}" ${g.id===selectedGameId?"selected":""}>${escapeHtml(g.name)}</option>`).join("");
}
document.getElementById("gameSelect").addEventListener("change", (e)=>{
  setSelectedGame(e.target.value);
  render();
});
document.getElementById("manageGamesBtn").addEventListener("click", ()=>{
  currentTab = "manage";
  tabButtons.forEach(b=>b.classList.toggle("active", b.dataset.tab==="manage"));
  render();
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ================= RECORD TAB ================= */
let editingMatchId = null; // null = new

function renderRecordTab(){
  const game = getGame(selectedGameId);
  if(!game){
    return `<div class="card empty-note">まずカードゲームを登録してください。<br><br>
      <button class="btn btn-primary" id="goManageBtn">ゲームを登録する</button></div>`;
  }
  if(game.decks.length===0){
    return `<div class="card empty-note">このゲームにデッキを登録してください。<br><br>
      <button class="btn btn-primary" id="goManageDeckBtn">デッキを登録する</button></div>`;
  }

  const editing = editingMatchId ? game ? data.matches.find(m=>m.id===editingMatchId) : null : null;
  const m = editing || { date: todayStr(), myDeckId: game.decks[0].id, opponentDeck:"", turn:"first", result:"win", tags:[], memo:"" };

  const opponentNames = Array.from(new Set(
    data.matches.filter(x=>x.gameId===game.id).map(x=>x.opponentDeck).filter(Boolean)
  ));

  return `
    <div class="card">
      <h3>${editing ? "対戦記録を編集" : "対戦を記録"}</h3>
      <div class="field">
        <label>日付</label>
        <input type="date" id="f_date" value="${m.date}">
      </div>
      <div class="field">
        <label>自分のデッキ</label>
        <select id="f_myDeck">
          ${game.decks.map(d=>`<option value="${d.id}" ${d.id===m.myDeckId?"selected":""}>${escapeHtml(d.name)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>相手のデッキ</label>
        <input type="text" id="f_oppDeck" list="oppDeckList" value="${escapeHtml(m.opponentDeck)}" placeholder="相手デッキ名を入力">
        <datalist id="oppDeckList">
          ${opponentNames.map(n=>`<option value="${escapeHtml(n)}">`).join("")}
        </datalist>
      </div>
      <div class="field">
        <label>先攻・後攻</label>
        <div class="choice-group">
          <div class="choice-btn ${m.turn==='first'?'active':''}" data-field="turn" data-value="first">先攻</div>
          <div class="choice-btn ${m.turn==='second'?'active':''}" data-field="turn" data-value="second">後攻</div>
        </div>
      </div>
      <div class="field">
        <label>結果</label>
        <div class="choice-group">
          <div class="choice-btn ${m.result==='win'?'active win':''}" data-field="result" data-value="win">勝ち</div>
          <div class="choice-btn ${m.result==='lose'?'active lose':''}" data-field="result" data-value="lose">負け</div>
          <div class="choice-btn ${m.result==='draw'?'active draw':''}" data-field="result" data-value="draw">引き分け</div>
        </div>
      </div>
      <div class="field">
        <label>タグ(複数選択可)</label>
        <div class="tag-wrap" id="f_tags">
          ${data.tags.map(t=>`<div class="tag-chip ${m.tags.includes(t.id)?'active':''}" data-tagid="${t.id}">${escapeHtml(t.name)}</div>`).join("")}
          <div class="tag-chip tag-add-chip" id="addTagChipBtn">＋ タグ追加</div>
        </div>
        <div class="tag-add-inline hidden" id="tagAddInline">
          <input type="text" id="tagAddInput" placeholder="新しいタグ名" maxlength="20">
          <button class="btn btn-sm btn-primary" id="tagAddConfirmBtn">追加</button>
          <button class="btn btn-sm" id="tagAddCancelBtn">キャンセル</button>
        </div>
      </div>
      <div class="field">
        <label>ひとことメモ(任意)</label>
        <textarea id="f_memo" placeholder="メモ">${escapeHtml(m.memo||"")}</textarea>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary btn-block" id="saveMatchBtn">${editing ? "更新する" : "記録する"}</button>
        ${editing ? `<button class="btn btn-block" id="cancelEditBtn">キャンセル</button>` : ``}
      </div>
    </div>
    <div class="section-title">最近の記録</div>
    <div id="recentMatchesArea"></div>
  `;
}

function bindRecordTab(){
  const goManageBtn = document.getElementById("goManageBtn");
  if(goManageBtn) goManageBtn.addEventListener("click", ()=>{ switchTab("manage"); });
  const goManageDeckBtn = document.getElementById("goManageDeckBtn");
  if(goManageDeckBtn) goManageDeckBtn.addEventListener("click", ()=>{ switchTab("manage"); });

  const game = getGame(selectedGameId);
  if(!game || game.decks.length===0) return;

  let state = currentFormState();

  document.querySelectorAll("#mainArea .choice-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const field = btn.dataset.field;
      const value = btn.dataset.value;
      document.querySelectorAll(`#mainArea .choice-btn[data-field="${field}"]`).forEach(b=>{
        b.classList.remove("active","win","lose","draw");
      });
      btn.classList.add("active");
      if(field==="result") btn.classList.add(value);
      formTempState[field] = value;
    });
  });
  document.querySelectorAll("#mainArea .tag-chip:not(.tag-add-chip)").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      chip.classList.toggle("active");
    });
  });

  const addTagChipBtn = document.getElementById("addTagChipBtn");
  const tagAddInline = document.getElementById("tagAddInline");
  const tagAddInput = document.getElementById("tagAddInput");

  function cancelTagAdd(){
    tagAddInline.classList.add("hidden");
    addTagChipBtn.classList.remove("hidden");
    tagAddInput.value = "";
  }
  function confirmTagAdd(){
    const name = tagAddInput.value.trim();
    if(!name) return;
    const existing = data.tags.find(t=>t.name===name);
    if(existing){
      const chip = document.querySelector(`#mainArea .tag-chip[data-tagid="${existing.id}"]`);
      if(chip) chip.classList.add("active");
      cancelTagAdd();
      return;
    }
    const newTag = {id:uid(), name};
    data.tags.push(newTag);
    save();
    const chip = document.createElement("div");
    chip.className = "tag-chip active";
    chip.dataset.tagid = newTag.id;
    chip.textContent = newTag.name;
    chip.addEventListener("click", ()=>{ chip.classList.toggle("active"); });
    addTagChipBtn.parentNode.insertBefore(chip, addTagChipBtn);
    cancelTagAdd();
  }
  if(addTagChipBtn){
    addTagChipBtn.addEventListener("click", ()=>{
      tagAddInline.classList.remove("hidden");
      addTagChipBtn.classList.add("hidden");
      tagAddInput.focus();
    });
    document.getElementById("tagAddCancelBtn").addEventListener("click", cancelTagAdd);
    document.getElementById("tagAddConfirmBtn").addEventListener("click", confirmTagAdd);
    tagAddInput.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){ e.preventDefault(); confirmTagAdd(); }
    });
  }

  document.getElementById("saveMatchBtn").addEventListener("click", ()=>{
    const date = document.getElementById("f_date").value || todayStr();
    const myDeckId = document.getElementById("f_myDeck").value;
    const opponentDeck = document.getElementById("f_oppDeck").value.trim();
    const turnBtn = document.querySelector('#mainArea .choice-btn[data-field="turn"].active');
    const resultBtn = document.querySelector('#mainArea .choice-btn[data-field="result"].active');
    const turn = turnBtn ? turnBtn.dataset.value : "first";
    const result = resultBtn ? resultBtn.dataset.value : "win";
    const tags = Array.from(document.querySelectorAll('#mainArea .tag-chip.active')).map(c=>c.dataset.tagid);
    const memo = document.getElementById("f_memo").value;

    if(!opponentDeck){
      alert("相手のデッキ名を入力してください。");
      return;
    }

    if(editingMatchId){
      const m = data.matches.find(x=>x.id===editingMatchId);
      Object.assign(m, {date, myDeckId, opponentDeck, turn, result, tags, memo});
    }else{
      data.matches.push({ id: uid(), gameId: game.id, date, myDeckId, opponentDeck, turn, result, tags, memo });
    }
    save();
    editingMatchId = null;
    render();
  });

  const cancelBtn = document.getElementById("cancelEditBtn");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=>{ editingMatchId = null; render(); });

  renderRecentMatches();
}

let formTempState = {};
function currentFormState(){ return formTempState; }

function renderRecentMatches(){
  const game = getGame(selectedGameId);
  const area = document.getElementById("recentMatchesArea");
  if(!area) return;
  const list = data.matches.filter(m=>m.gameId===game.id).sort((a,b)=> b.date.localeCompare(a.date) || 0).slice(0,10);
  if(list.length===0){
    area.innerHTML = `<div class="empty-note">まだ記録がありません</div>`;
    return;
  }
  area.innerHTML = list.map(m=>matchItemHtml(m)).join("");
  bindMatchItemActions(area);
}

function matchItemHtml(m){
  const game = getGame(m.gameId);
  const deck = game ? getDeck(game.id, m.myDeckId) : null;
  const resultLabel = m.result==="win"?"勝ち":m.result==="lose"?"負け":"引き分け";
  const tagNames = m.tags.map(tid=>{ const t=data.tags.find(x=>x.id===tid); return t?t.name:null; }).filter(Boolean);
  return `
  <div class="match-item" data-id="${m.id}">
    <div class="top-row">
      <span class="result-badge ${m.result}">${resultLabel}</span>
      <span class="meta">${m.date} / ${m.turn==="first"?"先攻":"後攻"}</span>
    </div>
    <div class="meta">${escapeHtml(deck?deck.name:"(不明デッキ)")} vs ${escapeHtml(m.opponentDeck)}</div>
    ${tagNames.length ? `<div class="tags">${tagNames.map(n=>`<span>${escapeHtml(n)}</span>`).join("")}</div>` : ""}
    ${m.memo ? `<div class="memo">${escapeHtml(m.memo)}</div>` : ""}
    <div class="actions">
      <button class="btn btn-sm editMatchBtn">編集</button>
      <button class="btn btn-sm btn-danger deleteMatchBtn">削除</button>
    </div>
  </div>`;
}

function bindMatchItemActions(container){
  container.querySelectorAll(".editMatchBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.closest(".match-item").dataset.id;

/* ================= STATS TAB ================= */
let statsDeck = "all";
let statsPeriodType = "month"; // day, week, month
let statsAnchorDate = new Date();

function periodRangeFor(type, anchor){
  if(type==="day") return dayRange(anchor);
  if(type==="week") return weekRange(anchor);
  return monthRange(anchor);
}
function periodLabel(type, anchor){
  if(type==="day") return fmtDate(anchor);
  if(type==="week"){
    const [s,e] = weekRange(anchor);
    return `${fmtDate(s)} 〜 ${fmtDate(e)}`;
  }
  return `${anchor.getFullYear()}年${anchor.getMonth()+1}月`;
}
function shiftAnchor(type, anchor, dir){
  if(type==="month") return new Date(anchor.getFullYear(), anchor.getMonth()+dir, 1);
  const d = new Date(anchor);
  if(type==="day") d.setDate(d.getDate()+dir);
  else if(type==="week") d.setDate(d.getDate()+dir*7);
  return d;
}

function renderStatsTab(){
  const game = getGame(selectedGameId);
  if(!game) return `<div class="card empty-note">ゲームを登録してください</div>`;

  return `

        <select id="st_deck">
          <option value="all">すべてのデッキ</option>
          ${game.decks.map(d=>`<option value="${d.id}" ${d.id===statsDeck?"selected":""}>${escapeHtml(d.name)}</option>`).join("")}
        </select>
      </div>
      <div class="period-type-row">
        <button class="btn ${statsPeriodType==='day'?'btn-primary':''}" data-ptype="day">日</button>
        <button class="btn ${statsPeriodType==='week'?'btn-primary':''}" data-ptype="week">週</button>
        <button class="btn ${statsPeriodType==='month'?'btn-primary':''}" data-ptype="month">月</button>
      </div>
      <div class="period-nav">

        <button class="btn btn-sm" id="nextPeriodBtn">次 ▶</button>

  `;
}

function renderStatsResults(){
  const game = getGame(selectedGameId);
  document.getElementById("periodLabel").textContent = periodLabel(statsPeriodType, statsAnchorDate);
  const [start,end] = periodRangeFor(statsPeriodType, statsAnchorDate);
  const startStr = fmtDate(start), endStr = fmtDate(end);

  let list = data.matches.filter(m=>m.gameId===game.id && m.date>=startStr && m.date<=endStr);
  if(statsDeck!=="all") list = list.filter(m=>m.myDeckId===statsDeck);

  const area = document.getElementById("statsResultArea");
  if(list.length===0){
    area.innerHTML = `<div class="card empty-note">この期間の記録はありません</div>`;
    return;
  }

  function winRate(arr){
    const w = arr.filter(m=>m.result==="win").length;
    const l = arr.filter(m=>m.result==="lose").length;
    const d = arr.filter(m=>m.result==="draw").length;
    const rate = (w+l)>0 ? Math.round((w/(w+l))*1000)/10 : null;
    return {w,l,d,rate};
  }

  const overall = winRate(list);
  const firstList = list.filter(m=>m.turn==="first");
  const secondList = list.filter(m=>m.turn==="second");
  const firstStat = winRate(firstList);
  const secondStat = winRate(secondList);

  // opponent deck breakdown
  const oppMap = {};
  list.forEach(m=>{
    if(!oppMap[m.opponentDeck]) oppMap[m.opponentDeck] = [];
    oppMap[m.opponentDeck].push(m);
  });
  const oppRows = Object.keys(oppMap).map(name=>{
    const st = winRate(oppMap[name]);
    return {name, ...st, total: oppMap[name].length};
  }).sort((a,b)=> b.total - a.total);

  // tag ranking (win causes / lose causes)
  function tagRanking(result){
    const counts = {};
    list.filter(m=>m.result===result).forEach(m=>{
      m.tags.forEach(tid=>{ counts[tid] = (counts[tid]||0)+1; });
    });
    return Object.keys(counts).map(tid=>{
      const t = data.tags.find(x=>x.id===tid);
      return { name: t? t.name : "(不明タグ)", count: counts[tid] };
    }).sort((a,b)=>b.count-a.count);
  }
  const winTags = tagRanking("win");
  const loseTags = tagRanking("lose");

  area.innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0;">全体成績</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${overall.rate!==null?overall.rate+"%":"-"}</div><div class="label">全体勝率</div></div>
        <div class="stat-box"><div class="num">${overall.w}勝${overall.l}敗</div><div class="label">引き分け ${overall.d}件</div></div>
        <div class="stat-box"><div class="num">${firstStat.rate!==null?firstStat.rate+"%":"-"}</div><div class="label">先攻勝率(${firstList.length}戦)</div></div>
        <div class="stat-box"><div class="num">${secondStat.rate!==null?secondStat.rate+"%":"-"}</div><div class="label">後攻勝率(${secondList.length}戦)</div></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">対面デッキ別勝率</div>
      <div style="overflow-x:auto;">
      <table class="data-table">
        <tr><th>相手デッキ</th><th>対戦数</th><th>勝率</th><th>引分</th></tr>
        ${oppRows.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${r.total}</td><td>${r.rate!==null?r.rate+"%":"-"}</td><td>${r.d}</td></tr>`).join("")}
      </table>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">勝因タグランキング</div>
      ${winTags.length? winTags.map((t,i)=>`<div class="list-item-row"><span class="name">${i+1}. ${escapeHtml(t.name)}</span><span class="sub">${t.count}回</span></div>`).join("") : `<div class="empty-note">データがありません</div>`}
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">敗因タグランキング</div>
      ${loseTags.length? loseTags.map((t,i)=>`<div class="list-item-row"><span class="name">${i+1}. ${escapeHtml(t.name)}</span><span class="sub">${t.count}回</span></div>`).join("") : `<div class="empty-note">データがありません</div>`}
    </div>
  `;
}

function bindManageTab(){
  renderGameListArea();
  renderDeckListArea();
  renderTagListArea();

  document.getElementById("addGameBtn").addEventListener("click", ()=>{
    openGameEditModal(null);
  });
  const addDeckBtn = document.getElementById("addDeckBtn");
  if(addDeckBtn) addDeckBtn.addEventListener("click", ()=>{
    const game = getGame(selectedGameId);
    if(game.decks.length>=50){
      alert("上限まで登録済みです");
      return;
    }
    openDeckEditModal(null);
  });

  document.getElementById("addTagBtn").addEventListener("click", ()=>{
    const input = document.getElementById("newTagInput");
    const name = input.value.trim();
    if(!name) return;
    if(data.tags.some(t=>t.name===name)){ alert("同名のタグが既にあります"); return; }
    data.tags.push({id:uid(), name});
    save();
    input.value = "";
    renderTagListArea();
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const ts = todayStr();
    a.href = url;
    a.download = `card_record_backup_${ts}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("importInput").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm("現在のデータは上書きされます。読み込みますか?")){
      e.target.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.games)){
          alert("ファイルの形式が正しくありません。");
          return;
        }
        data = {
          games: Array.isArray(parsed.games)?parsed.games:[],
          tags: Array.isArray(parsed.tags)?parsed.tags:DEFAULT_TAGS.map(n=>({id:uid(),name:n})),
          matches: Array.isArray(parsed.matches)?parsed.matches:[]
        };
        data.games.forEach(g=>{ if(!Array.isArray(g.decks)) g.decks=[]; });
        save();
        selectedGameId = data.games[0] ? data.games[0].id : null;
        setSelectedGame(selectedGameId);
        alert("データを読み込みました。");
        render();
      }catch(err){
        alert("ファイルの読み込みに失敗しました。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });
}

  renderGameSelect();
  const main = document.getElementById("mainArea");
  if(currentTab==="record"){
    main.innerHTML = renderRecordTab();
    bindRecordTab();
  }else if(currentTab==="list"){
    main.innerHTML = renderListTab();
    bindListTab();
  }else if(currentTab==="stats"){
    main.innerHTML = renderStatsTab();
    bindStatsTab();
  }else if(currentTab==="manage"){
    main.innerHTML = renderManageTab();
    bindManageTab();
  }
}

render();

})();
</script>
</body>
</html>
